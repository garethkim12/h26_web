<!DOCTYPE html>
<html lang="ko">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>KOBIS 영화 검색</title>
    <style>
        #searchResult {
            border : 1px solid red;
            padding: 10px;
            width: 75%;
            height: 700px;
            overflow-y: auto;
        }

        /* 팝업(모달) 스타일 정의 */
        .modal {
            display: none; /* 기본적으로 숨김 */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background-color: white;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
    <script>    
        const API_KEY = ''; // ⚠️ 여기에 발급받으신 OpenAPI Key를 입력하세요!

        // 1. 일별 박스오피스 목록 조회 API
        let getDailyBoxOffice = async function(searchDate) {    
            let params = new URLSearchParams({
                key : '',
                targetDt: searchDate
            });
            let url = `http://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?${params}`;
            let response = await fetch(url);
            return await response.json();
        };

        // 2. 영화 상세 정보 조회 API (추가됨)
        let getMovieDetail = async function(movieCode) {
            let params = new URLSearchParams({
                key: '',
                movieCd: movieCode
            });
            let url = `http://www.kobis.or.kr/kobisopenapi/webservice/rest/movie/searchMovieInfo.json?${params}`;
            let response = await fetch(url);
            return await response.json();
        };

        document.addEventListener('DOMContentLoaded', function(){
            let searchBtn = document.querySelector('#searchBtn');
            let searchResult = document.querySelector('#searchResult');
            
            let modal = document.querySelector('#movieModal');
            let overlay = document.querySelector('#modalOverlay');
            let closeModal = document.querySelector('#closeModal');
            let modalBody = document.querySelector('#modalBody');

            // 조회 버튼 클릭 이벤트
            searchBtn.addEventListener('click', async function(){
                let searchDate = document.querySelector('#searchDate').value.replaceAll('-', '');
                
                if(!searchDate) {
                    alert("날짜를 선택해주세요!");
                    return;
                }
            
                let data = await getDailyBoxOffice(searchDate);
                let movieArray = data.boxOfficeResult.dailyBoxOfficeList;
                
                searchResult.innerHTML = '';

                // 배열 순회하며 화면에 출력
                movieArray.forEach(function(movie){
                    let rank = movie.rank;
                    let movieName = movie.movieNm;
                    let movieCode = movie.movieCd; // 고유 영화코드 추출

                    // 버튼에 data-code 속성으로 영화코드를 심어줍니다.
                    let msg = `<h3>${rank}위 ${movieName}</h3>
                               <button class="detail-btn" data-code="${movieCode}">상세내용보기</button>`;      
                    searchResult.innerHTML += msg;
                });
            });

            // [상세내용보기] 버튼 클릭 이벤트 (이벤트 위임 방식 사용)
            searchResult.addEventListener('click', async function(e) {
                if(e.target && e.target.classList.contains('detail-btn')) {
                    let movieCode = e.target.getAttribute('data-code');
                    
                    // 상세 정보 API 호출
                    let detailData = await getMovieDetail(movieCode);
                    let movieInfo = detailData.movieInfoResult.movieInfo;

                    // 장르와 감독 배열을 문자열로 합치기
                    let genres = movieInfo.genres.map(g => g.genreNm).join(', ');
                    let directors = movieInfo.directors.map(d => d.peopleNm).join(', ');
                    let watchGrade = movieInfo.audits[0] ? movieInfo.audits[0].watchGradeNm : '정보 없음';

                    // 모달 창 내부에 데이터 채워넣기
                    modalBody.innerHTML = `
                        <h2>${movieInfo.movieNm} (${movieInfo.movieNmEn || ''})</h2>
                        <hr>
                        <p><strong>개봉일:</strong> ${movieInfo.openDt}</p>
                        <p><strong>상영시간:</strong> ${movieInfo.showTm}분</p>
                        <p><strong>장르:</strong> ${genres}</p>
                        <p><strong>감독:</strong> ${directors || '정보 없음'}</p>
                        <p><strong>관람등급:</strong> ${watchGrade}</p>
                    `;

                    // 모달 보여주기
                    modal.style.display = 'block';
                    overlay.style.display = 'block';
                }
            });

            // 모달 닫기 이벤트
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
                overlay.style.display = 'none';
            });
            overlay.addEventListener('click', function() {
                modal.style.display = 'none';
                overlay.style.display = 'none';
            });
        });
    </script> 
</head>
<body>
    <input type="date" id="searchDate"><button id="searchBtn">조회</button>
    <div id="searchResult"></div>    

    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="movieModal" class="modal">
        <span id="closeModal" class="close-btn">&times;</span>
        <div id="modalBody">
            </div>
    </div>
</body>
</html>

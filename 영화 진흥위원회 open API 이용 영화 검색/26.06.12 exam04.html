<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Document</title>

    <script>    
        document.addEventListener('DOMContentLoaded', function() {
            let btn = document.querySelector('button');
            
            btn.addEventListener('click', async function() {
                // 1. 오타 수정 (imputForm -> inputForm) 및 대입 연산자 (=) 추가
                let name = document.inputForm.name.value;
                let age = document.inputForm.age.value;

                // 2. Fetch 결과를 response 변수에 할당 (await 추가)
                let response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST', // 주로 대문자로 작성합니다.
                    headers: { // 3. 위 줄 끝에 쉼표(,) 추가됨
                        'content-type': 'application/x-www-form-urlencoded'
                    },
                    // 4. URLSearchParams 객체를 문자열로 변환하여 전송
                    body: new URLSearchParams({ 
                        name,
                        age
                    }).toString() 
                });

                // 5. response 변수가 정상적으로 정의되었으므로 이제 사용 가능
                if (response.ok) {
                    let data = await response.text();
                    data = JSON.parse(data);
                    console.log(data);
                    
                    let msg = `name : ${data.name} age : ${data.age}\n`;
                    let log = document.querySelector('#log');
                    log.textContent += msg;
                }
            });
        });
    </script> 
</head>
<body>
    <textarea rows='10' cols='60' id='log'></textarea> 
    <form name='inputForm' enctype='application/x-www-form-urlencoded'>
        이름 : <input type='text' name='name'><br>
        나이 : <input type='text' name='age'><br>
    </form>
    <button>전송</button>
</body>
</html>
